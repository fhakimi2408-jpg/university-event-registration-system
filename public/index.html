<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - University Event Registration System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0b2545 0%, #134074 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .auth-card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      overflow: hidden;
      max-width: 450px;
      width: 100%;
      background: #ffffff;
    }
    .auth-header {
      background: #8b0000;
      color: #fff;
      padding: 24px;
      text-align: center;
    }
    .badge-course {
      background-color: #ffd700;
      color: #333;
      font-weight: 600;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container p-3">
    <div class="auth-card mx-auto">
      <div class="auth-header">
        <span class="badge badge-course px-2 py-1 rounded mb-2">DES3083 Group G2</span>
        <h4 class="mb-1 fw-bold">UPSI Event Registration</h4>
        <p class="small mb-0 text-white-50">Staged Delivery Incremental System</p>
      </div>

      <div class="p-4">
        <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label fw-semibold">Email or Matric / Staff ID</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="loginKey" placeholder="e.g. D20241110929 or email" required>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" placeholder="Enter password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" style="background:#8b0000; border-color:#8b0000;">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
          </button>
        </form>

        <hr class="my-4">

        <div class="bg-light p-3 rounded small">
          <strong class="d-block text-secondary mb-1"><i class="bi bi-info-circle me-1"></i> Quick Demo Accounts:</strong>
          <div class="mb-1">
            <span class="badge bg-primary">Student</span> <code>D20241110929</code> / <code>student123</code>
          </div>
          <div>
            <span class="badge bg-danger">Admin</span> <code>STAFF001</code> / <code>admin123</code>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const loginKey = document.getElementById('loginKey').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('alertBox');

      alertBox.classList.add('d-none');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ loginKey, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          if (data.user.role === 'admin') {
            window.location.href = '/admin.html';
          } else {
            window.location.href = '/dashboard.html';
          }
        } else {
          alertBox.textContent = data.message || 'Login failed';
          alertBox.classList.remove('d-none');
        }
      } catch (err) {
        alertBox.textContent = 'Network or server error occurred.';
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
